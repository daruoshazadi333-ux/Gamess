<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gameing Room | GOD MODE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');
    :root {
      --bg: radial-gradient(circle at 30% 20%, #1a0a20, #0a0a14);
      --container-bg: rgba(15,18,28,0.8);
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.06);
      --text: #ddd;
      --text-dim: #888;
      --score-color: #ff6b00;
      --score-bg: rgba(255,107,0,0.15);
      --total-score-bg: rgba(255,255,255,0.04);
      --total-score-border: rgba(255,255,255,0.08);
      --btn-bg: rgba(255,255,255,0.05);
      --btn-border: rgba(255,255,255,0.1);
      --btn-color: #ccc;
      --shop-item-bg: rgba(255,255,255,0.04);
      --shop-item-border: rgba(255,255,255,0.08);
      --shop-price: #ffea00;
      --shop-badge: #4ade80;
      --footer-color: #555;
      --header-gradient: linear-gradient(135deg,#ff0055,#ff6b00,#ffea00);
    }
    body.light {
      --bg: radial-gradient(circle at 30% 20%, #f0e6ff, #e6e6fa);
      --container-bg: rgba(255,255,255,0.7);
      --card-bg: rgba(0,0,0,0.05);
      --card-border: rgba(0,0,0,0.1);
      --text: #222;
      --text-dim: #555;
      --score-color: #b45309;
      --score-bg: rgba(180,83,9,0.15);
      --total-score-bg: rgba(0,0,0,0.05);
      --total-score-border: rgba(0,0,0,0.1);
      --btn-bg: rgba(0,0,0,0.05);
      --btn-border: rgba(0,0,0,0.1);
      --btn-color: #333;
      --shop-item-bg: rgba(0,0,0,0.04);
      --shop-item-border: rgba(0,0,0,0.1);
      --shop-price: #b45309;
      --shop-badge: #166534;
      --footer-color: #777;
      --header-gradient: linear-gradient(135deg,#c026d3,#d97706,#ca8a04);
    }
    *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
    body{
      background: var(--bg);
      min-height:100vh;display:flex;justify-content:center;align-items:center;
      font-family:'Vazirmatn',sans-serif;padding:10px;overflow-x:hidden;direction:rtl;
      transition: background 0.3s;
    }
    .main-container{
      max-width:520px;width:100%;background:var(--container-bg);
      backdrop-filter:blur(25px);border-radius:30px;border:1px solid rgba(255,255,255,0.1);
      padding:18px;box-shadow:0 20px 50px rgba(0,0,0,0.6),0 0 60px rgba(120,0,255,0.1);
      transition: background 0.3s, border 0.3s;
    }
    .header{text-align:center;margin-bottom:14px;position:relative}
    .main-title{
      font-size:34px;font-weight:900;
      background: var(--header-gradient);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 15px rgba(255,0,85,0.4));
    }
    .subtitle{font-size:10px;color:var(--text-dim);margin-top:4px;letter-spacing:1px}
    .controls{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
    .ctrl-btn{
      background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--btn-color);
      border-radius:20px;padding:4px 12px;font-size:14px;cursor:pointer;
      backdrop-filter:blur(10px);transition:all 0.2s;display:flex;align-items:center;gap:4px;
      font-family:'Vazirmatn',sans-serif;
    }
    .ctrl-btn:active{background:rgba(255,255,255,0.12);color:#fff}
    .total-score-bar{
      background:var(--total-score-bg);border:1px solid var(--total-score-border);
      border-radius:20px;padding:12px 20px;margin-bottom:16px;display:flex;
      justify-content:space-between;align-items:center;backdrop-filter:blur(15px);
    }
    .total-score-label{font-size:12px;color:var(--text-dim)}
    .total-score-value{font-size:30px;font-weight:900;color:#ffea00;text-shadow:0 0 20px rgba(255,234,0,0.5)}
    .games-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .game-card{
      background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:20px;padding:16px 10px;text-align:center;cursor:pointer;
      transition:all 0.25s;position:relative;overflow:hidden;backdrop-filter:blur(10px);
    }
    .game-card:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(255,0,85,0.2);border-color:rgba(255,0,85,0.4)}
    .game-card:active{transform:scale(0.96)}
    .game-icon{font-size:42px;display:block;margin-bottom:6px;position:relative;z-index:1}
    .game-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;position:relative;z-index:1}
    .game-score{font-size:9px;color:var(--score-color);background:var(--score-bg);display:inline-block;padding:2px 10px;border-radius:8px;position:relative;z-index:1}
    .badge{position:absolute;top:8px;left:8px;font-size:8px;background:rgba(255,0,85,0.25);color:#ff6699;padding:2px 7px;border-radius:10px;z-index:1}
    .game-frame{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;background:#000}
    .game-frame.active{display:block}
    .game-frame iframe{width:100%;height:100%;border:none}
    .back-btn{position:fixed;top:12px;left:12px;z-index:1001;background:rgba(255,255,255,0.1);backdrop-filter:blur(15px);color:white;border:1px solid rgba(255,255,255,0.2);border-radius:50px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Vazirmatn',sans-serif}
    .btn-glass{background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:14px;padding:8px 16px;font-size:11px;color:var(--btn-color);cursor:pointer;width:100%;font-family:'Vazirmatn',sans-serif;backdrop-filter:blur(10px);margin-top:10px;transition:all 0.2s;text-align:center}
    .btn-glass:active{background:rgba(255,255,255,0.12);color:#fff}
    .panel{display:none}
    .panel.active{display:block}
    .shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
    .shop-item{background:var(--shop-item-bg);border:1px solid var(--shop-item-border);border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;backdrop-filter:blur(8px);transition:all 0.2s}
    .shop-item:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.4)}
    .shop-item.owned{border-color:#ffd966;background:rgba(255,217,102,0.1)}
    .shop-item.active-skin{border-color:#ff0055;box-shadow:0 0 20px rgba(255,0,85,0.3)}
    .shop-emoji{font-size:30px;display:block}
    .shop-name{font-size:10px;color:var(--text);margin:4px 0}
    .shop-price{font-size:9px;color:var(--shop-price)}
    .shop-badge{font-size:8px;color:var(--shop-badge)}
    .footer{text-align:center;font-size:8px;color:var(--footer-color);margin-top:10px}
  </style>
</head>
<body>
<div class="main-container" id="mainMenu">
  <div class="header">
    <div class="main-title">🎮 Gameing Room</div>
    <div class="subtitle" id="subtitleText">اتاق بازی | GOD MODE</div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="themeToggle">🌙</button>
    <button class="ctrl-btn" id="langToggle">فا</button>
  </div>
  <div class="total-score-bar"><span class="total-score-label" id="totalLabel">🏆 مجموع امتیازات</span><span class="total-score-value" id="totalScore">0</span></div>
  <div class="games-grid" id="gamesGrid"></div>
  <button class="btn-glass" id="shopBtn" onclick="showShop()">🛒 فروشگاه اسکین‌ها</button>
  <button class="btn-glass" id="adminBtn" onclick="showAdmin()" style="opacity:0.5;font-size:9px">🔑 پنل مدیریت</button>
  <button class="btn-glass" id="resetBtn" onclick="resetAllScores()" style="color:#ff5555">🗑️ ریست همه امتیازات</button>
  <div class="footer" id="footerText">Gameing Room | GOD MODE</div>
</div>

<div class="main-container panel" id="shopPanel">
  <button class="btn-glass" onclick="showMenu()" style="width:auto;margin-bottom:12px">⬅ بازگشت</button>
  <div style="text-align:center;font-size:20px;font-weight:900;color:#ffea00;margin:8px 0" id="shopTitle">🛒 فروشگاه اسکین</div>
  <div style="text-align:center;font-size:12px;color:#aaa;margin:4px 0">🪙 <span id="shopTotalLabel">امتیاز کل</span>: <span id="shopTotalScore">0</span></div>
  <div class="shop-grid" id="shopGrid"></div>
  <a href="https://rubika.ir/admin10blue" style="text-decoration:none"><button class="btn-glass" style="color:#ff0055;border-color:rgba(255,0,85,0.4)" id="customGameBtn">🎮 ساخت بازی اختصاصی</button></a>
</div>

<div class="main-container panel" id="adminPanel">
  <button class="btn-glass" onclick="showMenu()" style="width:auto;margin-bottom:12px">⬅ بازگشت</button>
  <div style="text-align:center;font-size:18px;font-weight:900;color:#ff0055;margin:8px 0" id="adminTitle">🔑 پنل ادمین</div>
  <input class="btn-glass" type="password" id="adminPass" placeholder="رمز عبور" style="text-align:center;color:#fff">
  <button class="btn-glass" onclick="checkAdmin()" style="color:#ff0055" id="loginBtn">ورود</button>
  <div id="adminContent" style="display:none;margin-top:12px">
    <div style="color:#4ade80;text-align:center;margin:8px 0" id="adminSuccess">✅ دسترسی کامل</div>
    <button class="btn-glass" onclick="unlockAll()" style="color:#ffea00" id="unlockBtn">🔓 همه بازی‌ها</button>
    <button class="btn-glass" onclick="addScore()" style="color:#ffea00" id="addScoreBtn">🪙 +۱۰۰۰ امتیاز</button>
    <button class="btn-glass" onclick="openGame('secret')" style="color:#ff0055" id="secretBtn">🔥 بازی مخفی</button>
  </div>
</div>

<div class="game-frame" id="gameFrame">
  <button class="back-btn" onclick="closeGame()">✕ بازگشت</button>
  <iframe id="gameIframe" allow="autoplay"></iframe>
</div>

<script>
// ========== CORE SYSTEM ==========
const SK = 'grs_god';
let scores = {snake:0,space:0,fruit:0,lightning:0,fall:0,robot:0,rps:0,secret:0,typing:0,basketball:0,gravity:0,sky:0,truthdare:0};
let secretUnlocked = false, adminUnlocked = false, activeSkinId = 'default';
let currentLang = 'fa', darkTheme = true;

const globalSkins = [
  {id:'default',name:'کلاسیک',emoji:'🎨',price:0,owned:true},
  {id:'neon',name:'نئونی',emoji:'💜',price:600,owned:false},
  {id:'fire',name:'آتشین',emoji:'🔥',price:1200,owned:false},
  {id:'gold',name:'طلایی',emoji:'👑',price:2500,owned:false},
  {id:'ice',name:'یخی',emoji:'❄️',price:1800,owned:false},
  {id:'shadow',name:'سایه',emoji:'🌑',price:3500,owned:false}
];

const translations = {
  fa: {
    subtitle:'اتاق بازی | GOD MODE',totalLabel:'🏆 مجموع امتیازات',
    shopBtn:'🛒 فروشگاه اسکین‌ها',adminBtn:'🔑 پنل مدیریت',
    resetBtn:'🗑️ ریست همه امتیازات',footerText:'Gameing Room | GOD MODE',
    shopTitle:'🛒 فروشگاه اسکین',shopTotalLabel:'امتیاز کل',
    customGameBtn:'🎮 ساخت بازی اختصاصی',adminTitle:'🔑 پنل ادمین',
    loginBtn:'ورود',adminSuccess:'✅ دسترسی کامل',unlockBtn:'🔓 همه بازی‌ها',
    addScoreBtn:'🪙 +۱۰۰۰ امتیاز',secretBtn:'🔥 بازی مخفی',backBtn:'⬅ بازگشت',
    gameNames:{snake:'مار و سیب',space:'حمله فضایی',fruit:'میوه برش ۲',lightning:'رعد و برق',fall:'فلپی فارسی',robot:'ربات‌دو',rps:'سنگ کاغذ قیچی',typing:'تایپ سریع ۲',basketball:'بسکتبال',gravity:'وارونه',sky:'Sky Escape 2.0',secret:'بازی مخفی',truthdare:'جرعت · حقیقت'}
  },
  en: {
    subtitle:'Gaming Room | GOD MODE',totalLabel:'🏆 Total Score',
    shopBtn:'🛒 Skin Shop',adminBtn:'🔑 Admin Panel',
    resetBtn:'🗑️ Reset All Scores',footerText:'Gameing Room | GOD MODE',
    shopTitle:'🛒 Skin Shop',shopTotalLabel:'Total Score',
    customGameBtn:'🎮 Custom Game',adminTitle:'🔑 Admin Panel',
    loginBtn:'Login',adminSuccess:'✅ Full Access',unlockBtn:'🔓 Unlock All',
    addScoreBtn:'🪙 +1000 Score',secretBtn:'🔥 Secret Game',backBtn:'⬅ Back',
    gameNames:{snake:'Snake',space:'Space Attack',fruit:'Fruit Slice 2',lightning:'Lightning',fall:'Flappy Persian',robot:'Robot Runner',rps:'Rock Paper Scissors',typing:'Speed Type 2',basketball:'Basketball',gravity:'Gravity Flip',sky:'Sky Escape 2.0',secret:'Secret Game',truthdare:'Truth or Dare'}
  }
};

function applyLanguage(){
  const t=translations[currentLang];
  document.getElementById('subtitleText').textContent=t.subtitle;
  document.getElementById('totalLabel').textContent=t.totalLabel;
  document.getElementById('shopBtn').textContent=t.shopBtn;
  document.getElementById('adminBtn').textContent=t.adminBtn;
  document.getElementById('resetBtn').textContent=t.resetBtn;
  document.getElementById('footerText').textContent=t.footerText;
  document.getElementById('shopTitle').textContent=t.shopTitle;
  document.getElementById('shopTotalLabel').textContent=t.shopTotalLabel;
  document.getElementById('customGameBtn').textContent=t.customGameBtn;
  document.getElementById('adminTitle').textContent=t.adminTitle;
  document.getElementById('loginBtn').textContent=t.loginBtn;
  document.getElementById('adminSuccess').textContent=t.adminSuccess;
  document.getElementById('unlockBtn').textContent=t.unlockBtn;
  document.getElementById('addScoreBtn').textContent=t.addScoreBtn;
  document.getElementById('secretBtn').textContent=t.secretBtn;
  document.querySelectorAll('.btn-glass[onclick="showMenu()"]').forEach(b=>b.textContent=t.backBtn);
  document.querySelector('.back-btn').textContent='✕ '+t.backBtn.replace('⬅ ','');
  document.querySelectorAll('.game-card').forEach(card=>{
    const k=card.getAttribute('data-game');
    if(k&&t.gameNames[k])card.querySelector('.game-name').textContent=t.gameNames[k];
  });
  const sc=document.getElementById('secretGameCard');
  if(sc)sc.querySelector('.game-name').textContent=t.gameNames.secret;
  document.getElementById('adminPass').placeholder=currentLang==='fa'?'رمز عبور':'Password';
}

function toggleLang(){
  currentLang=currentLang==='fa'?'en':'fa';
  document.getElementById('langToggle').textContent=currentLang==='fa'?'فا':'En';
  applyLanguage();renderShop();
}
function toggleTheme(){
  darkTheme=!darkTheme;
  document.body.classList.toggle('light',!darkTheme);
  document.getElementById('themeToggle').textContent=darkTheme?'🌙':'☀️';
  localStorage.setItem('grs_theme',darkTheme?'dark':'light');
}

const savedTheme=localStorage.getItem('grs_theme');
if(savedTheme==='light'){darkTheme=false;document.body.classList.add('light');document.getElementById('themeToggle').textContent='☀️'}
else {darkTheme=true;document.getElementById('themeToggle').textContent='🌙'}

document.getElementById('themeToggle').addEventListener('click',toggleTheme);
document.getElementById('langToggle').addEventListener('click',toggleLang);

function buildGameGrid(){
  const grid=document.getElementById('gamesGrid');
  const games=[
    {key:'snake',badge:'🐍',icon:'🍎'},{key:'space',badge:'🚀',icon:'👾'},
    {key:'fruit',badge:'🍉',icon:'🔪'},{key:'lightning',badge:'⚡',icon:'💥'},
    {key:'fall',badge:'🐦',icon:'🕊️'},{key:'robot',badge:'🤖',icon:'🏃'},
    {key:'rps',badge:'✂️',icon:'🪨'},{key:'typing',badge:'⌨️',icon:'📝'},
    {key:'basketball',badge:'🏀',icon:'🏀'},{key:'gravity',badge:'🔮',icon:'🔄'},
    {key:'sky',badge:'✈️',icon:'🌌'},{key:'truthdare',badge:'🎲',icon:'🔥'}
  ];
  grid.innerHTML='';
  games.forEach(g=>{
    const d=document.createElement('div');d.className='game-card';
    d.setAttribute('data-game',g.key);d.setAttribute('onclick',`openGame('${g.key}')`);
    d.innerHTML=`<span class="badge">${g.badge}</span><span class="game-icon">${g.icon}</span><div class="game-name">${translations[currentLang].gameNames[g.key]}</div><div class="game-score">🏆 <span id="${g.key}Score">0</span></div>`;
    grid.appendChild(d);
  });
  const sd=document.createElement('div');sd.className='game-card';sd.id='secretGameCard';
  sd.style.display='none';sd.setAttribute('data-game','secret');sd.setAttribute('onclick','openSecretGame()');
  sd.innerHTML=`<span class="badge">🔒</span><span class="game-icon">🔥</span><div class="game-name">${translations[currentLang].gameNames.secret}</div><div class="game-score">🏆 <span id="secretScore">0</span></div>`;
  grid.appendChild(sd);
}
buildGameGrid();applyLanguage();

function ld(){try{const s=localStorage.getItem(SK);if(s){const p=JSON.parse(s);Object.keys(scores).forEach(k=>{if(typeof p[k]==='number')scores[k]=p[k]});secretUnlocked=p.secretUnlocked||false;adminUnlocked=p.adminUnlocked||false;activeSkinId=p.activeSkin||'default'}}catch(e){}upd()}
function sv(){try{localStorage.setItem(SK,JSON.stringify({...scores,secretUnlocked,adminUnlocked,activeSkin:activeSkinId}))}catch(e){}}
function us(g,n){if(n>scores[g]){scores[g]=n;sv();upd()}}
function upd(){
  document.getElementById('snakeScore').textContent=scores.snake;
  document.getElementById('spaceScore').textContent=scores.space;
  document.getElementById('fruitScore').textContent=scores.fruit;
  document.getElementById('lightningScore').textContent=scores.lightning;
  document.getElementById('fallScore').textContent=scores.fall;
  document.getElementById('robotScore').textContent=scores.robot;
  document.getElementById('rpsScore').textContent=scores.rps;
  document.getElementById('secretScore').textContent=scores.secret;
  document.getElementById('typingScore').textContent=scores.typing;
  document.getElementById('basketballScore').textContent=scores.basketball;
  document.getElementById('gravityScore').textContent=scores.gravity;
  document.getElementById('skyScore').textContent=scores.sky;
  document.getElementById('truthdareScore').textContent=scores.truthdare;
  document.getElementById('totalScore').textContent=Object.values(scores).reduce((a,b)=>a+b,0);
  document.getElementById('shopTotalScore').textContent=Object.values(scores).reduce((a,b)=>a+b,0);
  if(secretUnlocked||adminUnlocked)document.getElementById('secretGameCard').style.display='block';
}
function getTotal(){return Object.values(scores).reduce((a,b)=>a+b,0)}
function renderShop(){
  const g=document.getElementById('shopGrid');g.innerHTML='';
  globalSkins.forEach(s=>{
    const d=document.createElement('div');d.className='shop-item';
    if(s.owned)d.classList.add('owned');if(activeSkinId===s.id)d.classList.add('active-skin');
    d.innerHTML=`<span class="shop-emoji">${s.emoji}</span><div class="shop-name">${s.name}</div>${s.owned?(activeSkinId===s.id?'<span class="shop-badge">✓ فعال</span>':'<span class="shop-badge">انتخاب</span>'):'<span class="shop-price">🪙'+s.price+'</span>'}`;
    d.onclick=()=>buySkin(s);g.appendChild(d);
  });
}
function buySkin(s){if(s.owned){activeSkinId=s.id;sv();renderShop();return}if(getTotal()>=s.price){s.owned=true;activeSkinId=s.id;sv();renderShop()}else{alert('🪙 امتیاز کافی نیست!')}}
function showShop(){document.getElementById('mainMenu').style.display='none';document.getElementById('shopPanel').classList.add('active');document.getElementById('adminPanel').classList.remove('active');renderShop()}
function showAdmin(){document.getElementById('mainMenu').style.display='none';document.getElementById('shopPanel').classList.remove('active');document.getElementById('adminPanel').classList.add('active')}
function showMenu(){document.getElementById('mainMenu').style.display='block';document.getElementById('shopPanel').classList.remove('active');document.getElementById('adminPanel').classList.remove('active')}
function checkAdmin(){if(document.getElementById('adminPass').value==='armin92nwjsudjdnesjsjx£#/bsbsjxjxbjp'){adminUnlocked=true;secretUnlocked=true;sv();upd();document.getElementById('adminContent').style.display='block';document.getElementById('adminPass').style.display='none'}else{alert('❌ رمز اشتباه')}}
function unlockAll(){secretUnlocked=true;sv();upd()}
function addScore(){scores.space+=1000;sv();upd()}
function resetAllScores(){if(confirm('همه امتیازات پاک شوند؟')){Object.keys(scores).forEach(k=>scores[k]=0);secretUnlocked=false;adminUnlocked=false;sv();upd()}}
function openSecretGame(){if(secretUnlocked||adminUnlocked||getTotal()>=2000){if(!secretUnlocked&&getTotal()>=2000){secretUnlocked=true;sv();upd()}openGame('secret')}else{alert('🔒 ۲۰۰۰ امتیاز لازمه')}}
function openGame(gameName){
  document.getElementById('gameIframe').srcdoc = gamesHTML[gameName] || '';
  document.getElementById('gameFrame').classList.add('active');
  document.getElementById('mainMenu').style.display='none';
  document.getElementById('shopPanel').classList.remove('active');
  document.getElementById('adminPanel').classList.remove('active');
}
function closeGame(){
  document.getElementById('gameFrame').classList.remove('active');
  document.getElementById('mainMenu').style.display='block';
  ld();
}
window.addEventListener('message',function(e){
  if(e.data && e.data.game && typeof e.data.score === 'number'){us(e.data.game, e.data.score);upd();}
});

// ========== GAMES (GOD MODE) + SOUND EFFECTS ==========
const gamesHTML = {};

// 1. مار و سیب GOD

ow{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:0 14px 6px}.lv-label{font-size:10px;color:#7F77DD;white-space:nowrap;font-weight:500}.lv-bar{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,0.07)}.lv-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#534AB7,#AFA9EC);transition:width 0.4s ease}.hp-row{position:relative;z-index:2;padding:0 14px 8px;display:flex;align-items:center;gap:6px}.hp-label{font-size:9px;color:#E24B4A;white-space:nowrap}.hp-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.07);overflow:hidden}.hp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#E24B4A,#F09595);transition:width 0.5s ease}.legend{position:relative;z-index:2;display:flex;gap:8px;padding:0 14px 8px;flex-wrap:wrap}.leg{font-size:9px;display:flex;align-items:center;gap:4px;color:#666}.leg-dot{width:7px;height:7px;border-radius:50%}.arena{position:relative;z-index:2;height:260px;overflow:hidden;margin:0 10px;border:0.5px solid rgba(255,255,255,0.07);border-radius:14px;background:rgba(0,0,0,0.35)}@media(min-width:480px){.arena{height:300px}}.danger-line{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(226,75,74,0.5)}.canvas-layer{position:absolute;inset:0;pointer-events:none;z-index:3}.word-el{position:absolute;font-size:12px;font-weight:500;padding:5px 10px;border-radius:30px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#ccc;white-space:nowrap;user-select:none;transition:border-color 0.12s,background 0.12s,color 0.12s;max-width:85vw}@media(min-width:480px){.word-el{font-size:13px;padding:6px 12px}}.word-el.gold{border-color:rgba(239,159,39,0.7);background:rgba(239,159,39,0.15);color:#EF9F27}.word-el.bomb{border-color:rgba(226,75,74,0.7);background:rgba(226,75,74,0.15);color:#F09595}.word-el.power{border-color:rgba(29,158,117,0.7);background:rgba(29,158,117,0.15);color:#9FE1CB}.word-el.active{border-color:#7F77DD;background:rgba(8 order:0.5px solid rgba(239,159,39,0.3);margin-bottom:12px;display:none}.ov-stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}.os{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;text-align:center;min-width:60px}.os-n{font-size:16px;font-weight:700}.os-l{font-size:9px;color:#555;margin-top:2px}.ov-sub{font-size:11px;color:#666;margin-bottom:16px;text-align:center;line-height:1.6;padding:0 10px}.start-btn{padding:10px 28px;border:none;border-radius:12px;background:linear-gradient(135deg,#534AB7,#7F77DD);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Vazirmatn',sans-serif;transition:opacity 0.15s}.start-btn:hover{opacity:0.85}</style></head><body><div class="game" id="game"><div class="bg-grid"></div><div class="glow-t"></div><div class="glow-b"></div><div class="header"><div class="hud"><div class="hb"><div class="hb-n gn" id="hScore">0</div><div class="hb-l">امتیاز</div></div><div class="hb"><div class="hb-n am" id="hCombo">0</div><div class="hb-l">کومبو</div></div><div class="hb"><div class="hb-n pp" id="hWords">0</div><div class="hb-l">کلمه</div></div></div><div class="logo"><div class="logo-ch">⚡ تایپ سریع</div><div class="logo-name">تایپ‌باز ۲</div></div></div><div class="level-row"><div class="lv-label" id="lvLabel">لول ۱</div><div class="lv-bar"><div class="lv-fill" id="lvFill" style="width:0%"></div></div><div class="lv-label" id="lvNext">۱۰ تا</div></div><div class="hp-row"><div class="hp-label">❤️</div><div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div><div class="hp-label" id="hpTxt">100</div></div><div class="legend"><div class="leg"><div class="leg-dot" style="background:#EF9F27"></div>طلایی ۳x</div><div class="leg"><div class="leg-dot" style="background:#E24B4A"></div>بمب</div><div class="leg"><div class="leg-dot" style="background:#1D9E75"></div>پاورآپ</div></div><div class="arena" id="arena"><div class="slow-overlay" id="slowOverlay"></div><canvas class="canvas-layer" id="fxCanvas"></canvas><div class="danger-line"></div><div class="powerup-notif" id="pwNotif"></div></div><div class="input-row"><input class="inp" id="inp" placeholder="تایپ کن..." autocomplete="off" autocorrect="off" spellcheck="false" disabled></div><div class="overlay" id="overlay"><div class="ov-ico">⌨️</div><div class="ov-title" id="ovTitle">تایپ سریع ۲</div><div class="ov-rec" id="ovRec"></div><div class="ov-stats" id="ovStats" style="display:none"><div class="os"><div class="os-n gn" id="osC">0</div><div class="os-l">درست</div></div><div class="os"><div class="os-n" style="color:#EF9F27" id="osG">0</div><div class="os-l">طلایی</div></div><div class="os"><div class="os-n" style="color:#E24B4A" id="osM">0</div><div class="os-l">از دست</div></div><div class="os"><div class="os-n pp" id="osW">0</div><div class="os-l">کلمه/دقیقه</div></div></div><div class="ov-sub" id="ovSub">لول‌آپ کن — کلمات طلایی ۳x امتیاز دارن<br>کلمه بمب رو قبل از رسیدن تایپ کن تا حذف بشه<br><span style="color:#1D9E75">پاورآپ سبز = زمان کند میشه!</span></div><button class="start-btn" id="startBtn">شروع بازی</button></div></div><script>
const EASY=['آب','باد','گل','کوه','دشت','ابر','ماه','شب','روز','راه','سنگ','برگ','آتش','تیر','دل','جان','دست','چشم','سر','پا'];const MED=['خانه','درخت','آسمان','زمین','کتاب','دانش','شادی','دوست','رنگ','ستاره','دریا','جنگل','باران','برف','آینه','پنجره','شهر','روستا','بازار','مدرسه','هواپیما','قطار','ماشین','رودخانه','باغچه','کوچه','خیابان','میدان','فروشگاه'];const HARD=['بیمارستان','دانشگاه','آزمایشگاه','کارخانه','رایانه','تلویزیون','کتابخانه','موزه','رستوران','آپارتمان','ایستگاه','فرودگاه','پیاده‌رو','زیرزمین','انقلاب','آزادی','امنیت','پیشرفت','اختراع','اکتشاف'];
let words=[],score=0,combo=0,hp=100,level=1,levelProgress=0,correctCount=0,missedCount=0,goldCount=0,running=false,slowActive=false,slowTimer=null,spawnTimer=null,tickTimer=null,startTime=0;let record=0;try{record=parseInt(localStorage.getItem('tv2rec')||0)}catch(e){}let actx=null;function ac(){if(!actx)try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){};return actx}function beep(t){try{const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(t==='hit'){o.type='sine';o.frequency.setValueAtTime(660,c.currentTime);o.frequency.setValueAtTime(880,c.currentTime+0.08);g.gain.setValueAtTime(0.15,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.22);o.start();o.stop(c.currentTime+0.22)}else if(t==='gold'){o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);o.frequency.setValueAtTime(1100,c.currentTime+0.08);o.frequency.setValueAtTime(1320,c.currentTime+0.16);g.gain.setValueAtTime(0.18,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.4);o.start();o.stop(c.currentTime+0.4)}else if(t==='bomb'){o.type='sawtooth';o.frequency.setValueAtTime(300,c.currentTime);o.frequency.setValueAtTime(150,c.currentTime+0.15);g.gain.setValueAtTime(0.15,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.35);o.start();o.stop(c.currentTime+0.35)}else if(t==='miss'){o.type='square';o.frequency.setValueAtTime(200,c.currentTime);o.frequency.setValueAtTime(140,c.currentTime+0.12);g.gain.setValueAtTime(0.1,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.3);o.start();o.stop(c.currentTime+0.3)}else if(t==='power'){o.type='sine';o.frequency.setValueAtTime(440,c.currentTime);o.frequency.setValueAtTime(660,c.currentTime+0.1);o.frequency.setValueAtTime(880,c.currentTime+0.2);g.gain.setValueAtTime(0.12,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.45);o.start();o.stop(c.currentTime+0.45)}else if(t==='lvup'){const notes=[523,659,784,1047];notes.forEach((f,i)=>{const oo=c.createOscillator(),gg=c.createGain();oo.connect(gg);gg.connect(c.destination);oo.type='sine';oo.frequency.value=f;gg.gain.setValueAtTime(0.12,c.currentTime+i*0.1);gg.gain.exponentialRampToValueAtTime(0.001,c.currentTime+i*0.1+0.2);oo.start(c.currentTime+i*0.1);oo.stop(c.currentTime+i*0.1+0.2)})}}catch(e){}}const particles=[];function spawnParticles(x,y,color,count){const canvas=document.getElementById('fxCanvas');for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2;const speed=1+Math.random()*3;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color,size:2+Math.random()*3})}}function drawParticles(){const canvas=document.getElementById('fxCanvas');const ctx=canvas.getContext('2d');const arena=document.getElementById('arena');canvas.width=arena.offsetWidth;canvas.height=arena.offsetHeight;ctx.clearRect(0,0,canvas.width,canvas.height);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.04;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}function wordPool(){if(level<=2)return EASY;if(level<=4)return [...EASY,...MED];return [...MED,...HARD]}function rndWord(){const p=wordPool();return p[Math.floor(Math.random()*p.length)]}function wordType(){const r=Math.random();if(r<0.12)return'gold';if(r<0.2)return'bomb';if(r<0.26)return'power';return'normal'}function spawnWord(){if(!running)return;const arena=document.getElementById('arena');const w=rndWord();const type=wordType();const el=document.createElement('div');el.className='word-el '+type;let label=w;if(type==='gold')label='⭐ '+w;else if(type==='bomb')label='💣 '+w;else if(type==='power')label='⚡ '+w;el.textContent=label;const aw=arena.offsetWidth;const ew=Math.min(w.length*12+50,aw-20);const x=5+Math.floor(Math.random()*(aw-ew-10));el.style.right=x+'px';el.style.top='-44px';const baseSpeed=0.45+level*0.16;const speed=slowActive?baseSpeed*0.38:baseSpeed+Math.random()*0.2;el.dataset.word=w;el.dataset.type=type;el.dataset.y=-44;el.dataset.speed=speed;arena.appendChild(el);words.push(el);updateActive()}function getSpawnInterval(){return Math.max(950,2100-level*160)}function startSpawnTimer(){clearInterval(spawnTimer);spawnTimer=setInterval(()=>{if(running)spawnWord()},getSpawnInterval())}function startGame(){words=[];score=0;combo=0;hp=100;level=1;levelProgress=0;correctCount=0;missedCount=0;goldCount=0;running=true;slowActive=false;particles.length=0;clearTimeout(slowTimer);clearInterval(spawnTimer);clearInterval(tickTimer);document.getElementById('overlay').style.display='none';document.getElementById('inp').disabled=false;document.getElementById('inp').value='';document.getElementById('inp').focus();document.getElementById('hScore').textContent=0;document.getElementById('hCombo').textContent=0;document.getElementById('hWords').textContent=0;document.getElementById('hpFill').style.width='100%';document.getElementById('hpTxt').textContent=100;document.getElementById('lvLabel').textContent='لول ۱';document.getElementById('lvFill').style.width='0%';document.getElementById('lvNext').textContent='۱۰ تا';document.getElementById('slowOverlay').className='slow-overlay';document.getElementById('arena').querySelectorAll('.word-el').forEach(e=>e.remove());startTime=Date.now();for(let i=0;i<2;i++)setTimeout(()=>spawnWord(),i*150);startSpawnTimer();tickTimer=setInterval(gameTick,40)}function updateActive(){const val=document.getElementById('inp').value.trim();words.forEach(el=>{const type=el.dataset.type;if(el.dataset.matched)return;if(val&&el.dataset.word.startsWith(val)){el.className='word-el active '+type}else{el.className='word-el '+type}})}function gameTick(){if(!running)return;drawParticles();const arena=document.getElementById('arena');const h=arena.offsetHeight;const toRemove=[];words.forEach(el=>{if(el.dataset.matched){toRemove.push(el);return}const spd=slowActive?parseFloat(el.dataset.speed)*0.38:parseFloat(el.dataset.speed);let y=parseFloat(el.dataset.y)+spd;el.dataset.y=y;el.style.top=y+'px';if(y>=h-38){if(!el.dataset.missed){el.dataset.missed='1';const type=el.dataset.type;if(type==='bomb'){const rect=el.getBoundingClientRect();const arenaRect=arena.getBoundingClientRect();spawnParticles(arenaRect.width-parseFloat(el.style.right)-40,y,'#E24B4A',8);beep('miss')}else if(type!=='power'){const dmg=(type==='gold'?20:12);hp=Math.max(0,hp-dmg);document.getElementById('hpFill').style.width=hp+'%';document.getElementById('hpTxt').textContent=hp;if(hp<=30)document.getElementById('hpFill').style.background='linear-gradient(90deg,#E24B4A,#F09595)';beep('miss');missedCount++;combo=0;document.getElementById('hCombo').textContent=0;if(hp<=0)endGame()}setTimeout(()=>{toRemove.push(el)},300)}}});toRemove.forEach(el=>{words=words.filter(w=>w!==el);if(el.parentNode)el.parentNode.removeChild(el)})}function flashInp(cls){const inp=document.getElementById('inp');inp.classList.add(cls);setTimeout(()=>inp.classList.remove(cls),200)}function showPowerNotif(txt){const n=document.getElementById('pwNotif');n.textContent=txt;n.className='powerup-notif show';setTimeout(()=>n.className='powerup-notif',1800)}function activateSlow(){slowActive=true;document.getElementById('slowOverlay').className='slow-overlay active';showPowerNotif('⚡ زمان کند شد!');beep('power');clearTimeout(slowTimer);slowTimer=setTimeout(()=>{slowActive=false;document.getElementById('slowOverlay').className='slow-overlay'},4000)}function doLevelUp(){level++;levelProgress=0;document.getElementById('lvLabel').textContent='لول '+level;document.getElementById('lvFill').style.width='0%';document.getElementById('lvNext').textContent='۱۰ تا';beep('lvup');showPowerNotif('🚀 لول '+level+'!');startSpawnTimer()}document.getElementById('inp').addEventListener('input',function(){if(!running)return;const val=this.value.trim();updateActive();const hit=words.find(el=>el.dataset.word===val&&!el.dataset.matched&&!el.dataset.missed);if(!hit)return;hit.dataset.matched='1';const type=hit.dataset.type;const arena=document.getElementById('arena');const x=arena.offsetWidth-parseFloat(hit.style.right)-40;const y=parseFloat(hit.dataset.y)+20;if(type==='bomb'){spawnParticles(x,y,'#E24B4A',14);spawnParticles(x,y,'#F09595',8);beep('bomb');flashInp('fl-r');hit.className='word-el bomb';setTimeout(()=>{words=words.filter(w=>w!==hit);if(hit.parentNode)hit.parentNode.removeChild(hit)},200);this.value='';updateActive();return}if(type==='power'){spawnParticles(x,y,'#1D9E75',14);spawnParticles(x,y,'#9FE1CB',8);activateSlow();flashInp('fl-t');hit.className='word-el power';setTimeout(()=>{words=words.filter(w=>w!==hit);if(hit.parentNode)hit.parentNode.removeChild(hit)},200);this.value='';updateActive();return}combo++;correctCount++;document.getElementById('hWords').textContent=correctCount;let pts=10+(combo>2?combo*2:0);if(type==='gold'){pts*=3;goldCount++;spawnParticles(x,y,'#EF9F27',16);spawnParticles(x,y,'#FAC775',10);beep('gold');flashInp('fl-y')}else{spawnParticles(x,y,'#7F77DD',10);spawnParticles(x,y,'#AFA9EC',6);beep('hit');flashInp('fl-g')}score+=pts;document.getElementById('hScore').textContent=score;document.getElementById('hCombo').textContent=combo;levelProgress++;const needed=10;document.getElementById('lvFill').style.width=Math.min((levelProgress/needed)*100,100)+'%';document.getElementById('lvNext').textContent=(needed-levelProgress)+' تا';if(levelProgress>=needed)doLevelUp();this.value='';updateActive()});function endGame(){if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearTimeout(slowTimer);document.getElementById('inp').disabled=true;const elapsed=Math.max(1,(Date.now()-startTime)/60000);const wpm=Math.round(correctCount/elapsed);const isRec=wpm>record;if(isRec){record=wpm;try{localStorage.setItem('tv2rec',wpm);window.parent.postMessage({game:'typing',score:wpm},'*')}catch(e){}}const ov=document.getElementById('overlay');ov.style.display='flex';document.getElementById('ovStats').style.display='flex';document.getElementById('osC').textContent=correctCount;document.getElementById('osG').textContent=goldCount;document.getElementById('osM').textContent=missedCount;document.getElementById('osW').textContent=wpm;document.getElementById('ovTitle').textContent=isRec?'رکورد جدید! 🏆':(hp<=0?'HP تموم شد!':'بازی تموم شد!');const recSpan=document.getElementById('ovRec');recSpan.textContent='🏆 رکورد: '+record+' کلمه/دقیقه';recSpan.style.display='inline-block';document.getElementById('ovSub').innerHTML='امتیاز: '+score+' | بهترین لول: '+level+'<br>'+(isRec?'✨ رکورد جدید زدی! ✨':'رکورد شخصی: '+record+' کلمه/دقیقه');document.getElementById('startBtn').textContent='دوباره بازی'}document.getElementById('startBtn').onclick=()=>startGame();

rawWall(o.x,o.gapY+o.gapH,o.w,o.botH);ctx.strokeStyle='hsla('+o.hue+',100%,75%,0.3)';ctx.lineWidth=1;ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(o.x,o.gapY);ctx.lineTo(o.x+o.w,o.gapY);ctx.stroke();ctx.beginPath();ctx.moveTo(o.x,o.gapY+o.gapH);ctx.lineTo(o.x+o.w,o.gapY+o.gapH);ctx.stroke();ctx.restore()});PL.trail.forEach((pt,i)=>{const t=i/PL.trail.length;ctx.save();ctx.globalAlpha=t*0.3;ctx.fillStyle='hsl('+pt.hue+',100%,65%)';ctx.shadowColor='hsl('+pt.hue+',100%,60%)';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(pt.x,pt.y,t*8,0,Math.PI*2);ctx.fill();ctx.restore()});ctx.save();const flipAngle=PL.flipping?PL.flipProgress*Math.PI:(gravDir===-1?Math.PI:0);ctx.translate(PL.x+PL.w/2,PL.y+PL.h/2);ctx.rotate(flipAngle);ctx.shadowColor='hsl('+PL.hue+',100%,60%)';ctx.shadowBlur=24;const pg=ctx.createLinearGradient(-PL.w/2,-PL.h/2,PL.w/2,PL.h/2);pg.addColorStop(0,'hsl('+PL.hue+',100%,72%)');pg.addColorStop(1,'hsl('+((PL.hue+50)%360)+',100%,50%)');ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(-PL.w/2,-PL.h/2,PL.w,PL.h,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.22)';ctx.beginPath();ctx.roundRect(-PL.w/2+3,-PL.h/2+3,PL.w-6,7,3);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.arc(PL.w/2-8,-2,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(PL.w/2-7,-3,1.8,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;ctx.setLineDash([3,8]);ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);ctx.restore();if(score>0){ctx.save();ctx.globalAlpha=0.04;ctx.font='900 '+H*.55+'px Vazirmatn';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(score,W/2,H*.45);ctx.restore()}ctx.restore()}
