<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>در حال بروزرسانی</title>
    <style>
        /* ---------- تنظیمات پایه ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Vazir', 'Tahoma', sans-serif;
            direction: rtl;
            /* پس‌زمینه گرادیان متحرک (عمیق‌تر و مدرن‌تر) */
            background: linear-gradient(135deg, #0c0e1a, #1a1e3a, #2d1b4e, #1a2a4a);
            background-size: 400% 400%;
            animation: gradientBG 14s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ---------- اشکال شناور در پس‌زمینه (حسی گرافیکی و عمیق) ---------- */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: floatShape 12s ease-in-out infinite alternate;
            will-change: transform;
        }

        .shape-1 {
            width: 350px;
            height: 350px;
            background: #ff6b9d;
            top: -80px;
            right: -100px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            background: #4facfe;
            bottom: -120px;
            left: -120px;
            animation-delay: -4s;
        }

        .shape-3 {
            width: 250px;
            height: 250px;
            background: #a18cd1;
            top: 50%;
            right: 10%;
            animation-delay: -8s;
            opacity: 0.2;
        }

        .shape-4 {
            width: 200px;
            height: 200px;
            background: #fbc2eb;
            bottom: 20%;
            left: 15%;
            animation-delay: -2s;
            opacity: 0.25;
        }

        @keyframes floatShape {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(30px, -40px) scale(1.1) rotate(5deg);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.9) rotate(-3deg);
            }
            100% {
                transform: translate(15px, -20px) scale(1.05) rotate(2deg);
            }
        }

        /* ---------- کارت اصلی (شیشه‌ای با درخشش) ---------- */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 3.5rem 4.5rem;
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
            animation: cardPulse 3s ease-in-out infinite;
        }

        @keyframes cardPulse {
            0%,
            100% {
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            }
            50% {
                box-shadow: 0 40px 100px rgba(79, 172, 254, 0.25), 0 30px 80px rgba(0, 0, 0, 0.6);
            }
        }

        /* ---------- محفظه اسپینر (حلقه‌های سه‌بعدی) ---------- */
        .spinner {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 2rem;
        }

        .ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            will-change: transform;
        }

        .ring-1 {
            border-top-color: #4facfe;
            border-right-color: #4facfe;
            animation: spin 1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            filter: drop-shadow(0 0 12px rgba(79, 172, 254, 0.5));
        }

        .ring-2 {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-bottom-color: #f093fb;
            border-left-color: #f093fb;
            animation: spin 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite reverse;
            filter: drop-shadow(0 0 12px rgba(240, 147, 251, 0.4));
        }

        .ring-3 {
            width: 55%;
            height: 55%;
            top: 22.5%;
            left: 22.5%;
            border-top-color: #fbc2eb;
            border-left-color: #fbc2eb;
            animation: spin 0.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            filter: drop-shadow(0 0 12px rgba(251, 194, 235, 0.5));
        }

        /* نقطه مرکزی (درخشنده) */
        .spinner::after {
            content: '⚡';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 20px #4facfe, 0 0 40px #a18cd1;
            animation: pulseCenter 1.2s ease-in-out infinite;
        }

        @keyframes pulseCenter {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.9;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 1;
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ---------- متن اصلی با افکت ---------- */
        .message {
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .message span {
            display: inline-block;
        }

        /* نقطه‌های متحرک (جذاب‌تر از حالت معمول) */
        .dots {
            display: inline-flex;
            gap: 6px;
            margin-right: 4px;
        }

        .dots span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: dotBounce 1.6s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .dots span:nth-child(1) {
            animation-delay: 0s;
        }
        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotBounce {
            0%,
            80%,
            100% {
                transform: translateY(0) scale(0.8);
                opacity: 0.4;
            }
            40% {
                transform: translateY(-12px) scale(1.2);
                opacity: 1;
            }
        }

        /* زیرنویس کوچک (حسی حرفه‌ای) */
        .sub-message {
            margin-top: 1.2rem;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 1rem;
        }

        /* ---------- واکنش‌گرایی موبایل ---------- */
        @media (max-width: 500px) {
            .container {
                padding: 2rem 1.5rem;
                width: 92%;
                border-radius: 2rem;
            }
            .spinner {
                width: 80px;
                height: 80px;
            }
            .spinner::after {
                font-size: 1.5rem;
            }
            .ring-2 {
                border-width: 3px;
            }
            .ring-3 {
                border-width: 3px;
            }
            .message {
                font-size: 1.4rem;
            }
            .dots span {
                width: 8px;
                height: 8px;
            }
            .shape-1,
            .shape-2 {
                width: 200px;
                height: 200px;
                filter: blur(60px);
            }
        }
    </style>
</head>
<body>

    <!-- اشکال گرافیکی پس‌زمینه -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>

    <!-- کارت اصلی -->
    <div class="container">
        <div class="spinner">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
        </div>

        <div class="message">
            <span>این صفحه در حال بروزرسانی است</span>
            <span class="dots">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </div>

        <div class="sub-message">لطفاً چند لحظه صبر کنید</div>
    </div>

</body>
</html>
